            sign_in_authorizations_html: Els usuaris s'hauran de verificar mitjançant tots els mètodes d'autorització de CiViCRM per poder utilitzar Decidim un cop iniciat la sessió.<br>Són obligatoris tots els mètodes enumerats. Els administradors estan exclosos.

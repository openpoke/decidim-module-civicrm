            send_meeting_registration_notifications: Enviar una notificació en registrar-se
            send_meeting_registration_notifications_html: Envia a l'usuari una notificació després de registrar-se a una trobada del Decidim.
            send_verification_notifications: Envia una notificació en verificar-se
            send_verification_notifications_html: Envia a l'usuari una notificació que s'ha verificat mitjançant un dels mètodes d'autorització de CiViCRM.

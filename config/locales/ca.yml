            omniauth_html: Afegeix un botó OAuth "inicia sessió amb CiViCRM" a la pàgina d'inici de sessió
            publish_meeting_registrations: Publica els registres a les trobades
            publish_meeting_registrations_html: Envia l'usuari registrat en una trobada a Decidim com un "EventRegistration" a l'API de CiViCRM.<br>Només es veuran afectats les trobades emparellades amb esdeveniments del CiViCRM.
            publish_meetings_as_events: Publica les trobades com a events
            publish_meetings_as_events_html: Si està actiu, totes les trobades publicades a Decidim s'enviaran a l'API de CiViCRM com a esdeveniment.<br>Això emparellarà cada reunió de Decidim recentment creada amb un nou esdeveniment de CiViCRM.

            publish_meetings_as_events: Publier les réunions en tant qu'événements
            publish_meetings_as_events_html: Si activé, chaque rencontre publiée dans Decidim sera envoyé à l'API CiViCRM comme événement.<br> Cela va apparier chaque nouvelle rencontre créée sur Decidim avec un nouvel événement CiViCRM.
